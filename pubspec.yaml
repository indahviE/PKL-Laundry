name: netwash
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Versi stabil yang kompatibel dengan web interop baru)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1

  # State Management (Dipastikan menggunakan versi stabil ^2.x atau menyesuaikan pre-release)
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1

  # UI & Navigation
  go_router: ^14.2.0
  flutter_hooks: ^0.21.1

  # UI Components
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Utilities
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  crypto: ^3.0.3

  # Validation
  email_validator: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Pastikan hanya ada satu entry ini
  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^3.2.5
  json_serializable: ^6.7.0

# Konfigurasi ini harus diletakkan di luar dev_dependencies, 
# biasanya di paling bawah file pubspec.yaml
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "asset/icon/Netwash - Logo.png"
  min_sdk_android: 21

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true