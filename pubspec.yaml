name: pkl_laundry
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Versi stabil yang kompatibel dengan web interop baru)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1

  # State Management (Dipastikan menggunakan versi stabil ^2.x atau menyesuaikan pre-release)
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1

  # UI & Navigation
  go_router: ^14.2.0
  flutter_hooks: ^0.21.1

  # UI Components
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  crypto: ^3.0.3

  # Validation
  email_validator: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true